plugins {
    id 'com.android.application'
}

android {
    namespace = 'au.home.betoverlay'
    compileSdk = 35

    defaultConfig {
        applicationId = 'au.home.betoverlay'
        minSdk = 28
        targetSdk = 34
        versionCode = 1
        versionName = '0.1.0'
    }

    // A fixed debug keystore (standard public debug password "android") is kept in the
    // repo so APKs built on any machine can be installed over each other with adb install -r.
    signingConfigs {
        debug {
            storeFile = file('debug.keystore')
            storePassword = 'android'
            keyAlias = 'androiddebugkey'
            keyPassword = 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
        }
        release {
            minifyEnabled = false
            signingConfig = signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        abortOnError = true
        checkReleaseBuilds = false
    }
}
